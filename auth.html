<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Future | Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">SMART<span>FUTURE</span></a>
    <nav><a href="index.html">Home</a></nav>
  </header>

  <main>
    <section class="section contact" style="max-width:520px;margin:80px auto;">
      <p class="eyebrow">SECURE ACCESS</p>
      <h2>Sign in to Smart Future</h2>
      <p class="section-text">This is the authentication entry point. The static GitHub Pages site does not store passwords or API keys.</p>

      <form id="loginForm">
        <label for="email">Email</label><br>
        <input id="email" name="email" type="email" required autocomplete="email"
          style="width:100%;padding:14px;margin:8px 0 18px;box-sizing:border-box;">

        <label for="password">Password</label><br>
        <input id="password" name="password" type="password" required autocomplete="current-password"
          style="width:100%;padding:14px;margin:8px 0 18px;box-sizing:border-box;">

        <button class="button" type="submit">Sign In</button>
        <p id="loginMessage" class="section-text" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
